<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tool Zone</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:sans-serif;
    background:#f4f4f4;
}

/* HEADER */
header{
    height:55px;
    background:#111;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
}

.menu{
    font-size:24px;
    cursor:pointer;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    top:0;
    left:-100%;
    width:70%;
    height:100%;
    background:#1c1c1c;
    color:#fff;
    padding:20px;
    transition:0.3s;
    z-index:1000;
}

.sidebar a{
    display:block;
    padding:12px;
    border-bottom:1px solid #333;
    color:white;
    text-decoration:none;
}

/* OVERLAY */
.overlay{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
    display:none;
    z-index:999;
}

/* MAIN */
.container{
    padding:15px;
}

/* TOOLS */
.tool-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.tool{
    background:#fff;
    padding:20px;
    border-radius:12px;
    text-align:center;
    font-weight:bold;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
    cursor:pointer;
}

/* FLOAT BTN */
.add{
    position:fixed;
    bottom:70px;
    left:50%;
    transform:translateX(-50%);
    width:60px;
    height:60px;
    border-radius:50%;
    border:none;
    background:#ff3b3b;
    color:white;
    font-size:28px;
    z-index:1000;
}

/* BOTTOM NAV */
.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    height:55px;
    background:#111;
    display:flex;
    justify-content:space-around;
    align-items:center;
}

.bottom button{
    background:none;
    border:none;
    color:#fff;
    font-size:20px;
}

/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.6);
}

.popup-box{
    background:#fff;
    padding:20px;
    border-radius:12px;
    width:80%;
    text-align:center;
}
</style>

</head>

<body>

<header>
    <div class="menu" onclick="openMenu()">☰</div>
    <div>DM Zone</div>
</header>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <a onclick="openPassword()">🔐 Password</a>
    <a href="https://youtube.com/@dmzone777?si=C1hGRZL91WJYtRyi" target="_blank">▶ YouTube</a>
    <a href="https://instagram.com" target="_blank">📸 Instagram</a>
    <a onclick="logout()">🚪 Logout</a>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- MAIN -->
<div class="container">
    <div class="tool-box">
        <div class="Tool" onclick="openTool('https://dmzone777.github.io/Sound-editor/')">Tool 1</div>
        <div class="tool" onclick="openTool('https://example.com')">Tool 2</div>
    </div>
</div>

<!-- FLOAT -->
<button class="add" onclick="openPopup()">+</button>

<!-- POPUP -->
<div class="popup" id="popup">
    <div class="popup-box">
        <h3>Coming Soon 🚀</h3>
        <br>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom">
    <button onclick="goHome()">🏠</button>
    <button onclick="openPopup()">➕</button>
    <button onclick="profile()">👤</button>
</div>

<script>

/* MENU */
function openMenu(){
    document.getElementById("sidebar").style.left="0";
    document.getElementById("overlay").style.display="block";
}

function closeMenu(){
    document.getElementById("sidebar").style.left="-100%";
    document.getElementById("overlay").style.display="none";
}

/* TOOL */
function openTool(link){
    window.open(link, "_blank");
}

/* PASSWORD */
function openPassword(){
    window.open("password.html","_blank");
}

/* LOGOUT */
function logout(){
    alert("Logout abhi working nahi hai");
}

/* PROFILE */
function profile(){
    alert("Profile coming soon");
}

/* HOME */
function goHome(){
    location.reload();
}

/* POPUP */
function openPopup(){
    document.getElementById("popup").style.display="flex";
}

function closePopup(){
    document.getElementById("popup").style.display="none";
}

</script>

</body>
</html>
