<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DM Zone</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:sans-serif;background:#f4f4f4;}

/* HEADER */
header{
    height:55px;background:#111;color:#fff;
    display:flex;align-items:center;justify-content:space-between;padding:0 15px;
}

.menu{font-size:24px;cursor:pointer;}

/* SIDEBAR */
.sidebar{
    position:fixed;top:0;left:-100%;
    width:70%;height:100%;
    background:#1c1c1c;color:#fff;
    padding:20px;transition:0.3s;z-index:1000;
}
.sidebar a{
    display:block;padding:14px;
    border-bottom:1px solid #333;
    color:white;text-decoration:none;
}

/* OVERLAY */
.overlay{
    position:fixed;top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    display:none;z-index:999;
}

/* MAIN */
.container{padding:15px;}
.tool-box{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.tool{
    background:#fff;padding:20px;border-radius:12px;
    text-align:center;font-weight:600;
    box-shadow:0 4px 8px rgba(0,0,0,0.1);
}

/* FLOAT BTN */
.add{
    position:fixed;bottom:70px;left:50%;
    transform:translateX(-50%);
    width:60px;height:60px;border-radius:50%;
    border:none;background:#ff3b3b;color:white;font-size:28px;
}

/* BOTTOM */
.bottom{
    position:fixed;bottom:0;width:100%;
    height:55px;background:#111;
    display:flex;justify-content:space-around;align-items:center;
}
.bottom button{
    background:none;border:none;color:#fff;font-size:20px;
}

/* PROFILE PAGE */
.profile-page{
    position:fixed;
    top:0;
    left:100%;
    width:100%;
    height:100%;
    background:#fff;
    transition:0.3s;
    z-index:2000;
    padding:20px;
}

.profile-header{
    display:flex;
    align-items:center;
    margin-bottom:20px;
}

.back-btn{
    font-size:22px;
    margin-right:10px;
    cursor:pointer;
}

/* SMALL LOGIN BOX */
.login-box{
    background:#f9f9f9;
    padding:15px;
    border-radius:10px;
}

.login-box input{
    width:100%;
    padding:10px;
    margin:6px 0;
}

.login-box button{
    width:100%;
    padding:10px;
    margin-top:5px;
}
</style>
</head>

<body>

<header>
    <div class="menu" onclick="openMenu()">☰</div>
    <div>DM Zone</div>
</header>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <a onclick="openPassword()">🔐 Password</a>
    <a href="https://youtube.com/@dmzone777?si=C1hGRZL91WJYtRyi" target="_blank">▶ YouTube</a>
    <a href="https://instagram.com" target="_blank">📸 Instagram</a>
    <a onclick="logout()">🚪 Logout</a>
</div>

<div class="overlay" id="overlay" onclick="closeMenu()"></div>

<!-- MAIN -->
<div class="container">
    <div class="tool-box">
        <div class="tool" onclick="openTool('https://dmzone777.github.io/Sound-editor/')">
            🎵 Sound Editor
        </div>
        <div class="tool" onclick="openTool('https://example.com')">
            ⚙️ Tool 2
        </div>
    </div>
</div>

<!-- FLOAT -->
<button class="add" onclick="openPopup()">+</button>

<!-- PROFILE PAGE -->
<div class="profile-page" id="profilePage">
    
    <div class="profile-header">
        <div class="back-btn" onclick="closeProfile()">←</div>
        <h3>Profile</h3>
    </div>

    <p id="userText">Not logged in</p>
    <br>

    <!-- SMALL LOGIN -->
    <div class="login-box">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">

        <button onclick="signup()">Sign Up</button>
        <button onclick="login()">Login</button>
        <button onclick="logout()">Logout</button>
    </div>

</div>

<!-- BOTTOM -->
<div class="bottom">
    <button onclick="goHome()">🏠</button>
    <button onclick="openPopup()">➕</button>
    <button onclick="openProfile()">👤</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDcZnUuqjD7lDHLj65V-f3E75w4DsSFQ1s",
  authDomain: "mini-instagram-2.firebaseapp.com",
  projectId: "mini-instagram-2"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* MENU */
window.openMenu = ()=>{
    sidebar.style.left="0";
    overlay.style.display="block";
}
window.closeMenu = ()=>{
    sidebar.style.left="-100%";
    overlay.style.display="none";
}

/* PROFILE */
window.openProfile = ()=>{
    profilePage.style.left="0";
}
window.closeProfile = ()=>{
    profilePage.style.left="100%";
}

/* AUTH */
window.signup = ()=>{
    createUserWithEmailAndPassword(auth,email.value,password.value)
    .then(()=>alert("Account Created ✅"))
    .catch(e=>alert(e.message));
}

window.login = ()=>{
    signInWithEmailAndPassword(auth,email.value,password.value)
    .then(()=>alert("Login Success ✅"))
    .catch(e=>alert(e.message));
}

window.logout = ()=>{
    signOut(auth).then(()=>alert("Logged Out ✅"));
}

/* AUTO USER */
onAuthStateChanged(auth,(user)=>{
    if(user){
        userText.innerText = "Logged in: " + user.email;
    }else{
        userText.innerText = "Not logged in";
    }
});

/* TOOL LOCK */
window.openTool = (link)=>{
    if(auth.currentUser){
        window.open(link,"_blank");
    }else{
        alert("Login required ❌");
        openProfile();
    }
}

/* OTHER */
window.goHome = ()=>location.reload();
window.openPassword = ()=>alert("Coming Soon");
window.openPopup = ()=>alert("Coming Soon");

</script>

</body>
</html>
